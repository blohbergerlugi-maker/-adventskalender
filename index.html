<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schul-Adventskalender</title>
<style id="css">
/* VOICE  festive school occasion: warm and bright for children, tidy enough for teachers
   IDEA   a real printed cardboard advent calendar: one winter picture, perforated doors of mixed sizes, a bow to hang it
   PICTURE the calendar itself (village, school, big tree, snowman); on the start page the snowy hill with a waving Wichtel
   COLOUR pine-green night ground, berry red, fir green, snow white, gold accent; every colour editable in the admin area
   TYPE   Outfit 800 for numbers and titles, Nunito for text
   LAYOUT start: centred code card beside the Wichtel; app: title strip, calendar full width, Wichtel band on snow; phone: 4 columns */
:root{--bg:#0f3b2d;--d1:#c8102e;--d2:#1e6a47;--d3:#fbf7f0;--acc:#f4c542;--acci:#1d2522;--ink:#fff;--btn:#0f3b2d;--df:'Outfit';--snow:color-mix(in srgb,var(--bg) 6%,#fff)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 'Nunito',system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
.band{padding-block:clamp(20px,3.4vw,44px);padding-left:max(5vw,16px,env(safe-area-inset-left,0px));padding-right:max(5vw,16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}
.sky,.bgimg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.bgimg{background-size:cover;background-position:center}
.bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(color-mix(in srgb,var(--bg) 60%,transparent),color-mix(in srgb,var(--bg) 25%,transparent))}
.dot{fill:var(--ink)}.spark{fill:var(--acc)}
.glow{background:radial-gradient(900px 520px at 82% -10%,color-mix(in srgb,var(--acc) 13%,transparent),transparent 70%)}
h1{font:800 clamp(32px,5vw,52px)/1.05 var(--df),'Outfit',system-ui,sans-serif;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{margin:10px 0 0;font-size:17px;opacity:.9;max-width:62ch}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 16px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--ink) 45%,transparent);background:transparent;cursor:pointer;font-weight:800}
.ghost:hover{background:color-mix(in srgb,var(--ink) 12%,transparent)}
.ghost svg{width:18px;height:18px}
/* Startseite */
.start{position:relative;isolation:isolate;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.stop{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px}
.brand{font:800 18px/1.2 var(--df),'Outfit',sans-serif}
.shero{position:relative;z-index:1;flex:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 56px;padding-top:8px;padding-bottom:max(70px,calc(min(18vw,260px) - 10px))}
.scard{width:min(520px,100%);background:#fff;color:#1d2522;border-radius:26px;padding:clamp(22px,3.5vw,38px);box-shadow:0 30px 60px rgba(0,0,0,.35);color-scheme:light}
.scard h1{color:var(--btn)}
.scard .sub{color:#46524d;opacity:1}
.sdate{margin:16px 0 0;font-size:15px;color:#5a6762}
.sdate b{color:#1d2522}
.lrow{display:flex;flex-wrap:wrap;gap:10px}
.lrow .inp{flex:1 1 220px}
.swave{width:clamp(170px,22vw,290px)}
.swave svg{display:block;width:100%;height:auto}
.ground{position:absolute;left:0;bottom:0;width:100%;height:min(18vw,260px);z-index:0}
.g1{fill:color-mix(in srgb,var(--bg) 82%,var(--ink))}
.tree{fill:color-mix(in srgb,var(--d2) 68%,#000)}
.trunk{fill:color-mix(in srgb,var(--d2) 35%,#000)}
.cap,.s1{fill:var(--snow)}
.s2{fill:color-mix(in srgb,var(--snow) 86%,var(--bg))}
.wall{fill:color-mix(in srgb,var(--d1) 80%,#000)}
.wall3{fill:color-mix(in srgb,var(--d3) 62%,var(--bg))}
.roof{fill:color-mix(in srgb,var(--bg) 50%,#000)}
.win{fill:var(--acc)}
.dr{fill:color-mix(in srgb,var(--bg) 35%,#000)}
/* Kalender-Seite */
.appm{position:relative;isolation:isolate}
.apph{position:relative;z-index:1;padding-bottom:clamp(10px,1.6vw,18px)}
.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.top h1{max-width:22ch}
.status{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
.tday{line-height:1.35}
.tday b{display:block;font:700 17px/1.3 var(--df),'Outfit',system-ui,sans-serif}
.tday span{font-size:15px;opacity:.9}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hi{font-weight:800;line-height:1.25}
.hi small{display:block;font-weight:600;font-size:14px;opacity:.85}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px 0 6px;border-radius:999px;background:color-mix(in srgb,var(--ink) 14%,transparent);font-weight:800}
.chip b{font:800 18px/1 'Outfit',sans-serif}
.coin{flex:none;width:28px;height:28px}
.board{position:relative;z-index:1;isolation:isolate;overflow:hidden;padding-top:clamp(36px,4vw,52px);padding-bottom:max(56px,calc(min(18vw,260px) - 22px))}
.frame{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:clamp(7px,1.3vw,15px);border-radius:10px;background:linear-gradient(160deg,#ffffff,#ebe3d3);box-shadow:0 3px 0 #cbbfa9,0 28px 50px rgba(0,0,0,.42)}
.bow{position:absolute;left:50%;top:0;z-index:3;width:clamp(96px,12vw,150px);translate:-50% -58%;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.bow .b1{fill:var(--d1)}.bow .b2{fill:color-mix(in srgb,var(--d1) 75%,#000)}
.grid{position:relative;display:grid;gap:clamp(4px,.7vw,8px);grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));aspect-ratio:8/4.3;grid-template-areas:"p1 p2 p2 p3 . p4 p5 p6" "p7 p8 p9 p9 p10 p11 p5 p12" "p7 p13 p9 p9 p14 p11 p15 p12" "p16 p16 p17 p18 p18 p19 p20 ." "p21 p22 p17 p23 p24 p24 p20 .";border-radius:4px;background:var(--scene,none) 0 0/100% 100% no-repeat,var(--bg)}
.cell{position:relative;grid-area:var(--ad);perspective:1200px}
.cell.open{z-index:2}
.in{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:2px;border:0;padding:4px;border-radius:4px;background:#fbf7f0;color:#1d2522;box-shadow:inset 0 3px 10px rgba(0,0,0,.4);cursor:pointer;container-type:size;width:100%}
.in svg{width:min(58cqmin,120px);height:auto}
.in small{font-weight:800;font-size:13px;line-height:1.1}
.door{position:absolute;inset:0;border:0;padding:0;background:none;cursor:pointer;transform-origin:left center;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,.7,.2,1)}
.face{position:absolute;inset:0;border-radius:4px;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.front{background-image:var(--scene,none);background-size:var(--bw) var(--bh);background-position:var(--bx,0) var(--by,0);background-repeat:no-repeat;background-color:var(--bg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),0 1px 0 rgba(255,255,255,.2);container-type:size}
.front::after{content:"";position:absolute;inset:3px;border:2px dashed rgba(255,255,255,.75);border-radius:3px;pointer-events:none}
.back{transform:rotateY(180deg);background:linear-gradient(135deg,#efe7d8,#d6cbb7);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.badge{position:absolute;display:grid;place-items:center;width:max(30px,min(46cqmin,74px));aspect-ratio:1;border-radius:50%;background:var(--bc);color:var(--nc);font:800 max(15px,min(23cqmin,38px))/1 var(--df),'Outfit',sans-serif;box-shadow:0 0 0 max(2px,1.6cqmin) rgba(255,255,255,.7),0 3px 6px rgba(0,0,0,.35)}
.b-c{left:50%;top:50%;translate:-50% -50%}.b-tl{left:13%;top:13%}.b-tr{right:13%;top:13%}.b-bl{left:13%;bottom:13%}.b-br{right:13%;bottom:13%}
@media(hover:hover){.door:hover{transform:rotateY(-13deg)}}
.cell.open .door{transform:rotateY(-108deg);pointer-events:none}
.cell.today .front{box-shadow:inset 0 0 0 3px var(--acc),0 0 24px color-mix(in srgb,var(--acc) 75%,transparent)}
.cell.today .badge{left:50%;top:50%;right:auto;bottom:auto;translate:-50% -50%}
.tag{position:absolute;left:50%;bottom:5px;translate:-50% 0;padding:2px 9px;border-radius:999px;background:var(--acc);color:var(--acci);font:800 13px/1.25 'Nunito',sans-serif;white-space:nowrap}
.snow{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-12px;border-radius:50%;background:#fff;animation:fall linear infinite;will-change:transform}
@keyframes fall{to{transform:translate3d(var(--dx),var(--h,900px),0)}}
/* Wichtel */
.wich{background:var(--snow);color:#1d2522;padding-top:4px}
.wg{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:12px 44px;align-items:center}
.ava svg{display:block;width:100%;height:auto}
.wich h2{margin:0;font:800 clamp(28px,3.6vw,40px)/1.08 var(--df),'Outfit',sans-serif;letter-spacing:-.015em;color:color-mix(in srgb,var(--bg) 35%,#0b1210)}
.purse{display:inline-flex;align-items:center;gap:10px;margin:14px 0 6px;padding:8px 18px 8px 10px;border-radius:999px;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.08);font-weight:800;font-size:17px;color:#1d2522}
.purse b{font:800 30px/1 'Outfit',sans-serif}
.purse .coin{width:34px;height:34px}
.wtxt p{margin:6px 0 0;max-width:62ch}
.foot{background:var(--snow);color:color-mix(in srgb,var(--bg) 25%,#0b1210);padding-top:0}
.how{display:flex;flex-wrap:wrap;gap:8px 32px;justify-content:space-between;align-items:baseline;border-top:1px solid color-mix(in srgb,var(--bg) 14%,transparent);padding-top:16px}
.how p{margin:0;max-width:74ch}
.note{font-size:14px;opacity:.8}
/* Dialoge */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(6,12,10,.64)}
.card{width:min(440px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:#fff;color:#1d2522;border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.4);color-scheme:light}
.card.wide{width:min(900px,100%)}
.card:fullscreen{width:100%;max-height:none;border-radius:0}
.card:fullscreen .cbody>p{font-size:clamp(20px,2.3vw,30px)}
.chd{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;padding:14px 16px 14px 18px;background:var(--hc,#1d2522);color:#fff}
.chd h2{margin:0;font:800 clamp(22px,3vw,30px)/1.1 var(--df),'Outfit',sans-serif;letter-spacing:-.01em}
.num{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--acc);color:var(--acci);font:800 24px/1 var(--df),'Outfit',sans-serif;box-shadow:0 0 0 3px rgba(255,255,255,.6)}
.x{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.16);cursor:pointer;color:inherit}
.chd .x:first-of-type{margin-left:auto}
.x svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.cbody{padding:20px 22px 24px}
.cbody>p{margin:0 0 12px;font-size:17px}
.f{display:block;font-weight:800;font-size:15px;margin:14px 0 6px}
.inp{width:100%;min-height:48px;padding:10px 14px;font-size:16px;border:1.5px solid #c6cfcb;border-radius:12px;background:#fff;color:#1d2522}
.inp.bad{border-color:#b3261e}
.codein{font:800 22px/1 'Outfit',sans-serif;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.big{min-height:58px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:0;border-radius:12px;background:var(--btn);color:#fff;font-weight:800;cursor:pointer;text-decoration:none;text-align:center}
.btn.big{min-height:58px;padding:0 26px;font-size:18px}
.btn.sec{background:#edf1ef;color:#1d2522}
.btn:disabled,.btn.off{opacity:.5;cursor:not-allowed}
.full{width:100%}
.msg{min-height:1.4em;margin:10px 0 0;font-size:15px;font-weight:700;color:#b3261e}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.hint{font-size:14px;color:#5a6762;margin:6px 0 0;font-weight:400}
.earn{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:6px 16px 6px 8px;border-radius:999px;background:#fff4cf;color:#5b4300;font-weight:800}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}
.file{margin:0;border:1px solid #dfe5e2;border-radius:14px;overflow:hidden;background:#f6f8f7}
.file.big{grid-column:1/-1}
.file img,.file video{display:block;width:100%;max-height:min(62vh,560px);object-fit:contain;background:#101614}
.file figcaption{padding:8px 12px;font-size:14px;color:#5a6762}
a.doc{display:grid;gap:2px;padding:14px 16px;color:#1d2522;text-decoration:none}
a.doc b{font:800 15px/1.2 'Outfit',sans-serif;color:var(--btn)}
a.doc span{font-weight:700;overflow-wrap:anywhere}
a.doc small{font-size:13px;color:#5a6762}
a.doc:hover{background:#edf1ef}
/* Shop */
.shop{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:20px;padding:18px 20px 22px}
.sprev{position:sticky;top:96px;align-self:start;padding:10px 10px 12px;border-radius:18px;background:linear-gradient(#e9f2ee,#fff);text-align:center}
.sprev svg{display:block;width:100%;height:auto}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}
.item{display:grid;gap:3px;padding:8px 8px 10px;border:1.5px solid #d3dbd7;border-radius:14px;background:#fff;cursor:pointer;text-align:center}
.item[aria-pressed=true]{border-color:var(--btn);box-shadow:0 0 0 2px var(--btn)}
.item svg{width:100%;height:88px;border-radius:10px;background:#eef3f1}
.item b{font-size:14px;line-height:1.2}
.item small{font-size:13px;font-weight:800;color:#5a6762}
.item small.own{color:#1e6a47}
.sbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid #e2e8e5}
.sbar p{margin:0;flex:1 1 200px;font-weight:700}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #c6cfcb;cursor:pointer}
.swatch[aria-pressed=true]{box-shadow:0 0 0 3px var(--btn)}
/* Admin */
.adm{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(620px,100%);display:flex;flex-direction:column;background:#fff;color:#1d2522;box-shadow:-20px 0 60px rgba(0,0,0,.35);color-scheme:light}
@media(min-width:1120px){body.ao #app{margin-right:620px}}
.ahd{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 20px;border-bottom:1px solid #e2e8e5}
.ahd h2{margin:0;font:800 22px/1.1 'Outfit',sans-serif}
.ahd .x{margin-left:auto;background:#edf1ef}
.tabs{display:flex;gap:2px;padding:6px 12px 0;border-bottom:1px solid #e2e8e5;overflow-x:auto}
.tabs button{flex:none;min-height:46px;padding:0 12px;border:0;border-bottom:3px solid transparent;background:none;font-weight:800;color:#5a6762;cursor:pointer}
.tabs button[aria-selected=true]{color:#1d2522;border-color:var(--btn)}
.abody{flex:1;overflow:auto;padding:18px 20px 28px}
.abar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid #e2e8e5;background:#f6f8f7}
.abar .st{flex:1 1 180px;font-size:14px;color:#5a6762}
.sec h3{margin:26px 0 8px;font:800 18px/1.25 'Outfit',sans-serif}
.sec h3:first-child{margin-top:0}
.sec h3 .hint{font:400 15px 'Nunito',sans-serif}
.banner{margin:0 0 14px;padding:10px 14px;border-radius:12px;background:#fff3d2;color:#5b4300;font-size:14px}
.dpick{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.dpick button{position:relative;min-height:44px;border:1.5px solid #d3dbd7;border-radius:10px;background:#fff;font-weight:800;cursor:pointer}
.dpick button.has::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.dpick button[aria-pressed=true]{background:var(--btn);border-color:var(--btn);color:#fff}
textarea.inp{min-height:150px;resize:vertical;line-height:1.5}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.flist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.flist li{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border:1px solid #e2e8e5;border-radius:10px}
.flist li span{flex:1;font-weight:700;overflow-wrap:anywhere}
.flist small{font-weight:400;color:#5a6762}
.mini{flex:none;min-height:40px;padding:0 12px;border:1.5px solid #d3dbd7;border-radius:10px;background:#fff;font-weight:800;cursor:pointer}
.mini.del{color:#b3261e}
.up{position:relative;overflow:hidden}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.preset{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 12px;border:1.5px solid #d3dbd7;border-radius:12px;background:#fff;font-weight:800;cursor:pointer;text-align:left}
.sw{display:flex;padding-left:5px}
.sw i{width:20px;height:20px;margin-left:-5px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #d3dbd7}
.colors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.colors label{display:grid;gap:6px;font-size:14px;font-weight:800}
input[type=color]{width:100%;height:44px;padding:3px;border:1.5px solid #d3dbd7;border-radius:10px;background:#fff;cursor:pointer}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;padding:0 14px;border:1.5px solid #d3dbd7;border-radius:10px;background:#fff;font-weight:800;cursor:pointer}
.seg button[aria-pressed=true]{background:#1d2522;border-color:#1d2522;color:#fff}
.tog{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700;cursor:pointer}
.tog input{flex:none;width:22px;height:22px;accent-color:var(--btn)}
.plist{display:grid;gap:8px;margin-top:12px}
.prow{border:1.5px solid #e2e8e5;border-radius:14px;padding:10px}
.prow.offp{background:#f6f6f6;opacity:.85}
.pmain{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.8fr);gap:8px}
.pact{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.pact .tog{margin-right:auto}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:6px;margin-top:10px}
.cchip{display:flex;align-items:center;gap:6px;min-height:44px;padding:2px 4px 2px 10px;border:1px solid #e2e8e5;border-radius:10px;font-size:14px}
.cchip b{width:1.6em;font-family:'Outfit',sans-serif}
.cchip span{flex:1;overflow-wrap:anywhere}
.cchip.off span{text-decoration:line-through;color:#8a958f}
.cchip input{width:20px;height:20px;accent-color:var(--btn)}
.cchip button{min-height:36px;padding:0 8px;border:1px solid #d3dbd7;border-radius:8px;background:#fff;font-weight:800;font-size:13px;cursor:pointer}
.prices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.prices label{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.prices span{flex:1}
.prices .inp{width:96px;min-height:42px}
.scroll{overflow-x:auto}
.log{width:100%;border-collapse:collapse;font-size:14px}
.log th,.log td{padding:7px 8px;border-bottom:1px solid #e2e8e5;text-align:left;white-space:nowrap}

rsch- oder Forsythienzweig schneidet und ins Wasser stellt, hat mit etwas Glück an Weihnachten Blüten im Zimmer. Vielleicht auch im Lehrerzimmer?","link":"","linkLabel":"","files":[]},{"title":"Weihnachten in den Niederlanden","text":"In den Niederlanden ist heute ein großer Tag: Am Abend des 5. Dezember bringt Sinterklaas die Geschenke. Viele Familien schreiben sich dazu lustige Gedichte.","link":"","linkLabel":"","files":[]},{"title":"Nikolaus","text":"Haben Sie gestern Ihre Stiefel geputzt? Der Brauch geht auf den heiligen Nikolaus zurück, der vor langer Zeit in Myra lebte. Das liegt in der heutigen Türkei.","link":"","linkLabel":"","files":[]},{"title":"Bastelzeit: Schneeflocke","text":"Falten Sie ein quadratisches Blatt zweimal zur Hälfte und dann noch einmal schräg zu einem Dreieck. Schneiden Sie kleine Formen an den Rändern heraus und falten Sie vorsichtig auf. Jede Schneeflocke wird anders!","link":"","linkLabel":"","files":[]},{"title":"Plätzchen-Rechnen","text":"Lena backt 3 Bleche mit je 12 Plätzchen. Ihr Bruder nascht 5 davon. Wie viele Plätzchen bleiben übrig?\n\nLösung: 31 Plätzchen.","link":"","linkLabel":"","files":[]},{"title":"Wussten Sie schon?","text":"Fast alle Schneeflocken haben sechs Arme. Das liegt daran, wie sich Wasserteilchen beim Gefrieren aneinanderlegen. Trotzdem sieht keine Flocke genau wie die andere aus.","link":"","linkLabel":"","files":[]},{"title":"Ihr Lieblingsmoment","text":"Was ist Ihr schönster Moment im Advent? Erzählen Sie es heute Ihrer Klasse. Die Schülerinnen und Schüler sind gespannt.","link":"","linkLabel":"","files":[]},{"title":"Weihnachten in Mexiko","text":"In Mexiko feiern viele Familien vom 16. bis 24. Dezember Las Posadas: Sie ziehen singend von Haus zu Haus, und zum Abschluss wird oft eine Piñata zerschlagen.","link":"","linkLabel":"","files":[]},{"title":"Wörter-Jagd","text":"Wie viele Wörter finden Sie in WEIHNACHTSBAUM? Jeder Buchstabe darf so oft vorkommen, wie er im Wort steht. Beispiele: BAUM, NACHT, HEU. Wer im Kollegium findet die meisten?","link":"","linkLabel":"","files":[]},{"title":"Luciafest","text":"In Schweden und Dänemark ist heute Luciatag. Ein Mädchen trägt einen Kranz mit Lichtern auf dem Kopf, und viele Kinder ziehen in weißen Gewändern singend durch Schulen und Kirchen.","link":"","linkLabel":"","files":[]},{"title":"Lied des Tages","text":"Heute wünschen wir uns „Kling, Glöckchen, klingelingeling“. Das Lied ist schon über 150 Jahre alt. Welches alte Weihnachtslied mögen Sie am liebsten?","link":"","linkLabel":"","files":[]},{"title":"Experiment: Salz und Eis","text":"Legen Sie zwei Eiswürfel auf je einen Teller und streuen Sie auf einen davon etwas Salz. Was passiert? Salz senkt den Gefrierpunkt, deshalb taut der gesalzene Eiswürfel schneller.","link":"","linkLabel":"","files":[]},{"title":"Weihnachten in Großbritannien","text":"In Großbritannien gehören Christmas Crackers zum Festessen am 25. Dezember: Papphülsen, die beim Auseinanderziehen knallen. Darin stecken eine Papierkrone, ein kleiner Witz und ein Geschenk.","link":"","linkLabel":"","files":[]},{"title":"Bewegungspause","text":"Wie wäre es heute mit einer Rentier-Pause? Zehn Hopser auf der Stelle, fünf Kniebeugen und dann ganz leise auf Zehenspitzen zurück zum Pult.","link":"","linkLabel":"","files":[]},{"title":"Wer bin ich?","text":"Ich hänge am Baum, bin rund und glänze. Essen kann man mich aber nicht. Wer bin ich?\n\nLösung: die Christbaumkugel.","link":"","linkLabel":"","files":[]},{"title":"Gute Tat","text":"Schreiben Sie heute eine Weihnachtskarte für jemanden, der sich darüber freut: das Sekretariat, den Hausmeister oder eine Kollegin.","link":"","linkLabel":"","files":[],"openDay":18},{"title":"Wussten Sie schon?","text":"Lebkuchen werden in Nürnberg schon seit Jahrhunderten gebacken. „Nürnberger Lebkuchen“ ist heute sogar ein geschützter Name.","link":"","linkLabel":"","files":[],"openDay":18},{"title":"Der kürzeste Tag","text":"Um den 21. Dezember ist Wintersonnenwende: der Tag mit den wenigsten Stunden Sonnenlicht im ganzen Jahr. Danach werden die Tage langsam wieder länger.","link":"","linkLabel":"","files":[]},{"title":"Weihnachten in Australien","text":"In Australien ist im Dezember Sommer. Viele Familien feiern Weihnachten mit einem Picknick oder am Strand, und manchmal kommt der Weihnachtsmann sogar auf einem Surfbrett.","link":"","linkLabel":"","files":[]},{"title":"Vorlesezeit","text":"Kurz vor dem Fest wünschen wir uns eine Weihnachtsgeschichte zum Vorlesen. Vielleicht in der letzten Stunde vor den Ferien?","link":"","linkLabel":"","files":[],"openDay":18},{"title":"Frohe Weihnachten!","text":"Alle Schülerinnen und Schüler danken Ihnen für dieses Jahr und wünschen Ihnen und Ihren Familien ein frohes Fest, erholsame Ferien und einen guten Start ins neue Jahr.","link":"","linkLabel":"","files":[],"openDay":18}]}</script>

function ghGuess(){const m=location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i),segs=location.pathname.split('/').filter(Boolean).map(decodeURIComponent),file=segs.length&&/\.html?$/i.test(segs[segs.length-1])?segs.pop():'index.html';if(!m)return {owner:'',repo:'',branch:'',path:file,token:''};if(segs.length){const repo=segs.shift();return {owner:m[1],repo,branch:'',path:[...segs,file].join('/'),token:''}}return {owner:m[1],repo:location.hostname.toLowerCase(),branch:'',path:file,token:''}}

const ghReady=()=>{const g=ghCfg();return !!(g.token&&g.owner&&g.repo&&g.path)};
const encPath=p=>String(p).split('/').filter(Boolean).map(encodeURIComponent).join('/');
async function gh(method,url,body){const g=ghCfg();const r=await fetch('https://api.github.com'+url,{method,cache:'no-store',headers:Object.assign({'Accept':'application/vnd.github+json','Authorization':'Bearer '+g.token,'X-GitHub-Api-Version':'2022-11-28'},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});let j=null;try{j=await r.json()}catch(e){}if(!r.ok){const e=new Error((j&&j.message)||('HTTP '+r.status));e.status=r.status;throw e}return j}

const ub=b=>{const a=b instanceof Uint8Array?b:new Uint8Array(b);let o='';for(let i=0;i<a.length;i+=32768)o+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(o)};

const b64file=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(f)});

/* ===== Zeichnen ===== */
function render(){
 const s=cur(),g=s.design;applyDesign(g);
 const p=person(),app=adminOpen||!!p;
 $('#start').hidden=app;$('#app').hidden=!app;
 if(!app){
  $('#stitle').textContent=g.title||'Adventskalender';const ssub=$('#ssub');ssub.textContent=g.subtitle||'';ssub.hidden=!g.subtitle;
  $('#sdate').textContent=dateLine();$('#smsg').textContent=statusLine(s);$('#shint').textContent=g.loginHint||'';
  if(!$('#swave').firstChild)$('#swave').innerHTML=avatarSvg(Object.assign(WDEF(),{wear:{hat:'hat-santa',top:'top-xmas',scarf:'',glasses:'',acc:'acc-cane',pet:''}}));
  $('#snow').innerHTML='';return;
 }
 $('#t').textContent=g.title||'Adventskalender';const sub=$('#sub');sub.textContent=g.subtitle||'';sub.hidden=!g.subtitle;
 $('#tdate').textContent=dateLine();$('#tmsg').textContent=statusLine(s);
 const u=g.bgImage?fileUrl(g.bgImage):'',bi=$('#bgimg');bi.hidden=!u;if(u)bi.style.backgroundImage='url("'+u.replace(/["\\\n]/g,'')+'")';$('#sky').style.display=u?'none':'';
 const O=adminOpen?[]:openedBy(p);
 $('#grid').innerHTML=Array.from({length:24},(_,i)=>{const n=i+1,c=bcol(n),[ad,am]=slot(s,n),open=O.includes(n),td=isToday(s,n)&&!open;
  return `<div class="cell${open?' open':''}${td?' today':''}" style="--ad:${ad};--am:${am};--bc:${c.bc};--nc:${c.nc}"><button type="button" class="in" data-n="${n}"${open?'':' tabindex="-1" aria-hidden="true"'} aria-label="Türchen ${n} ansehen">${icon(n)}<small>${n===24?'Frohe Weihnachten':'Türchen '+n}</small></button><button type="button" class="door" data-n="${n}"${open?' tabindex="-1" aria-hidden="true"':''} aria-label="Türchen ${n}${td?', heute':''}"><span class="face back"></span><span class="face front"><span class="badge ${n===24?'b-c':BPOS[n%6]}">${n}</span>${td?'<span class="tag">Heute</span>':''}</span></button></div>`}).join('');
 renderWho();renderWichtel();layoutBg(true);
 $('#how').textContent=(s.settings.codeMode==='door'?'So geht’s: Mit dem Code für ein Türchen anmelden oder ein Türchen antippen und seinen Code eingeben. ':'So geht’s: Mit dem eigenen Code anmelden und ein Türchen antippen. ')+lockText(s.settings)+(s.settings.reviewOpen?' Geöffnete Türchen lassen sich jederzeit wieder ansehen.':'');
 $('#note').hidden=!st.sample;
}
function layoutBg(force){
 const g=$('#grid');if(!g||$('#app').hidden)return;const W=g.clientWidth,H=g.clientHeight;if(!W||!H)return;
 g.style.setProperty('--bw',W+'px');g.style.setProperty('--bh',H+'px');
 g.querySelectorAll('.cell').forEach(c=>{c.style.setProperty('--bx',-c.offsetLeft+'px');c.style.setProperty('--by',-c.offsetTop+'px')});
 const asp=Math.round(H/W*50)/50,key=JSON.stringify(pal)+asp;
 if(key!==sceneKey){sceneKey=key;sceneUrl='url("data:image/svg+xml,'+encodeURIComponent(sceneSvg(pal,1600,Math.round(1600*asp)))+'")';g.style.setProperty('--scene',sceneUrl)}
}
new ResizeObserver(()=>layoutBg()).observe($('#grid'));
new ResizeObserver(()=>{$('#snow').style.setProperty('--h',($('#board').clientHeight+24)+'px')}).observe($('#board'));
function buildSnow(){const el=$('#snow');if(!cur().design.snow||$('#app').hidden){el.innerHTML='';return}const R=rng(7);el.innerHTML=Array.from({length:46},()=>{const z=2+R()*4;return `<i style="left:${(R()*100).toFixed(2)}%;width:${z.toFixed(1)}px;height:${z.toFixed(1)}px;--dx:${((R()-.5)*90)|0}px;opacity:${(.35+R()*.5).toFixed(2)};animation-duration:${(10+R()*12).toFixed(1)}s;animation-delay:-${(R()*22).toFixed(1)}s"></i>`}).join('')}
function renderWho(){
 const el=$('#who'),p=person();
 if(adminOpen&&!p){el.innerHTML='<span class="chip" style="padding-left:14px">Admin-Vorschau</span>';return}
 if(!p){el.innerHTML='';return}
 const w=wallet(p.id);
 el.innerHTML=`<span class="hi">Hallo ${esc(p.name)}!<small>${p.role==='lehrer'?'Lehrkraft':'Schüler/in'}${p.group?' · '+esc(p.group):''}</small></span>${cur().settings.avatar?`<span class="chip" title="Münzen">${COIN}<b>${w.coins}</b></span>`:''}<button type="button" class="ghost" data-act="logout">Abmelden</button>${adminOpen?'':`<button type="button" class="ghost" data-act="admin" aria-label="Admin-Bereich">${ICON}</button>`}`;
}
function renderWichtel(){
 const s=cur(),sec=$('#wich');sec.hidden=!s.settings.avatar;if(!s.settings.avatar)return;
 const p=person(),w=p?wallet(p.id):WDEF();
 $('#ava').innerHTML=avatarSvg(w);
 $('#wh').textContent=p?(w.name||'Der Wichtel von '+p.name):'Ihr Wichtel';
 $('#wc').textContent=w.coins;
 const got=p?openedBy(p).length:0,co=Math.max(0,+s.settings.coins||0),bo=Math.max(0,+s.settings.bonus||0);
 $('#wp').textContent=p?`${got} von 24 Türchen geöffnet. Jedes neue Türchen bringt ${co} Münzen${bo?', am richtigen Tag '+bo+' extra':''}. Damit können Sie im Shop neue Sachen für Ihren Wichtel kaufen.`:'In der Admin-Vorschau sammelt der Wichtel keine Münzen.';
 $('#ww').textContent='Trägt: '+(wornNames(w)||'nichts Besonderes');
}

/* ===== Dialoge ===== */
function openOv(html,cls=''){if($('#ov').hidden)lastFocus=document.activeElement;const c=$('#card');c.className='card'+cls;c.innerHTML=html;$('#ov').hidden=false;c.scrollTop=0;(c.querySelector('input:not([type=checkbox])')||c.querySelector('.x'))?.focus()}
function closeOv(){if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});$('#ov').hidden=true;$('#card').innerHTML='';if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
let tt=0;function toast(s){const e=$('#toast');e.textContent=s;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,4000)}
const head=(n,title,extra='')=>{const c=bcol(n);return `<div class="chd" style="--hc:${c.bc};color:${c.nc}"><span class="num">${n}</span><h2>${esc(title)}</h2>${extra}${XBTN}</div>`};
const plainHead=t=>`<div class="chd"><h2>${esc(t)}</h2>${XBTN}</div>`;
function notYet(n){const d=doorDate(st,n),k=dayDiff(today(),d);openOv(head(n,'Türchen '+n)+`<div class="cbody"><p>Dieses Türchen öffnet sich erst am <b>${esc(fmtDate(d,{weekday:'long',day:'numeric',month:'long'}))}</b>.</p><p class="hint">Noch ${k} ${k===1?'Tag':'Tage'} Geduld.</p><div class="acts"><button type="button" class="btn full" data-act="close">Verstanden</button></div></div>`)}

function clickDoor(n){
 if(adminOpen){showContent(n,draft,0);return}
 const p=person();if(!p){render();return}
 if(openedBy(p).includes(n)&&st.settings.reviewOpen){showContent(n,st,0);return}
 if(!reachable(st,n)){notYet(n);return}
 if(st.settings.codeMode==='door'){
  openOv(head(n,'Türchen '+n)+`<div class="cbody" id="fdoor" data-n="${n}"><p>Geben Sie den Code für Türchen ${n} ein.</p><label class="f" for="ccode">Türchen-Code</label><input class="inp codein" id="ccode" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go"><p class="msg" id="cmsg" aria-live="polite"></p><div class="acts"><button type="button" class="btn full" data-act="doorgo">Türchen öffnen</button></div></div>`);return;
 }
 const lk=isToday(st,n)?null:lockOf(lkey(p,n));
 if(lk){openOv(head(n,'Türchen '+n)+`<div class="cbody"><p>${lk.door?'Sie haben schon Türchen '+(+lk.door)+' geöffnet. ':''}Das nächste Türchen können Sie ab <b>${esc(fmtTime(lk.until))}</b> öffnen.</p><div class="acts">${lk.door?`<button type="button" class="btn" data-act="view" data-n="${+lk.door}">Türchen ${+lk.door} ansehen</button>`:''}<button type="button" class="btn sec" data-act="close">Schließen</button></div></div>`);return}
 openOv(head(n,'Türchen '+n)+`<div class="cbody"><p>Möchten Sie Türchen ${n} jetzt öffnen?</p><p class="hint">${esc(lockText(st.settings))}</p><div class="acts"><button type="button" class="btn" data-act="confirm" data-n="${n}">Öffnen</button><button type="button" class="btn sec" data-act="close">Abbrechen</button></div></div>`);
}
function submitDoor(n){
 unlockAudio();const inp=$('#ccode'),m=$('#cmsg'),t=tooMany();
 if(t){m.textContent=waitMsg(t);return}
 const r=lookup(inp.value);
 if(r.err){if(r.bad)fail();m.textContent=r.err;inp.select();return}
 if(r.n!==n){m.textContent='Das ist der Code für Türchen '+r.n+'.';return}
 okTry();const p=r.p;
 if(openedBy(p).includes(n)){switchTo(p);closeOv();render();showContent(n,st,0);return}
 const lk=lockOf(lkey(p,n));if(lk){m.textContent='Dieser Code ist gesperrt bis '+fmtTime(lk.until)+'.';return}
 switchTo(p);reveal(n,recordOpen(p,n));
}
function switchTo(p){if(ss.get('who')!==p.id){ss.set('who',p.id);renderWho();toast('Angemeldet als '+p.name+'.')}}
function submitLogin(){
 unlockAudio();const inp=$('#lcode'),m=$('#lmsg'),t=tooMany();m.textContent='';
 if(t){m.textContent=waitMsg(t);return}
 const r=lookup(inp.value);
 if(r.err){if(r.bad)fail();m.textContent=r.err;inp.select();return}
 okTry();const p=r.p,n=r.n;
 if(n){const lk=lockOf(lkey(p,n));if(lk&&!openedBy(p).includes(n)){m.textContent='Dieser Code wurde schon benutzt und ist gesperrt bis '+fmtTime(lk.until)+'.';return}}
 ss.set('who',p.id);inp.value='';render();buildSnow();window.scrollTo(0,0);
 const go=()=>{if(n)setTimeout(()=>{if(openedBy(p).includes(n)){showContent(n,st,0);return}if(!reachable(st,n)){notYet(n);return}reveal(n,recordOpen(p,n))},450)};
 if(st.settings.avatar&&!wallet(p.id).made)setTimeout(()=>openMake(p,go),350);else go();
}
function reveal(n,amt){
 closeOv();const cell=$('#grid').querySelector(`.door[data-n="${n}"]`)?.parentElement,rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(cell){cell.classList.remove('today');cell.querySelector('.tag')?.remove();cell.classList.add('open');cell.scrollIntoView({block:'nearest',behavior:rm?'auto':'smooth'})}
 chime();
 setTimeout(()=>{render();showContent(n,st,amt);if(amt)setTimeout(coinSnd,250)},rm?0:900);
}
function showContent(n,s,amt){
 const d=s.doors[n-1],files=d.files.map(f=>Object.assign({},f,{u:fileUrl(f),type:String(f.type||'')})).filter(f=>f.u),p=person();
 const paras=String(d.text||'').trim().split(/\n\s*\n/).filter(Boolean).map(x=>'<p>'+esc(x.trim()).replace(/\n/g,'<br>')+'</p>').join('');
 const imgs=files.filter(f=>/^image\//.test(f.type)),vids=files.filter(f=>/^video\//.test(f.type)),docs=files.filter(f=>!/^(image|video)\//.test(f.type));
 const fh=files.length?'<div class="files">'+vids.map(f=>`<figure class="file big"><video controls preload="metadata" src="${esc(f.u)}"></video><figcaption>${esc(f.name)}</figcaption></figure>`).join('')
  +imgs.map(f=>`<figure class="file${imgs.length===1?' big':''}"><a href="${esc(f.u)}" target="_blank" rel="noopener"><img src="${esc(f.u)}" alt="${esc(f.name)}" loading="lazy"></a></figure>`).join('')
  +docs.map(f=>`<a class="file doc" href="${esc(f.u)}" target="_blank" rel="noopener"><b>${kind(f.type)}</b><span>${esc(f.name)}</span><small>${esc(size(f.size))} · öffnen</small></a>`).join('')+'</div>':'';
 const link=/^https:\/\/\S+$/i.test(d.link||'')?`<a class="btn" href="${esc(d.link)}" target="_blank" rel="noopener">${esc(d.linkLabel||'Link öffnen')}</a>`:'';
 const empty=paras||fh||link?'':'<p class="hint">Hinter diesem Türchen ist noch nichts eingetragen.</p>';
 const earn=amt&&p?`<span class="earn">${COIN}+${amt} Münzen für ${esc(p.name)}</span>`:'';
 openOv(head(n,d.title||'Türchen '+n,`<button type="button" class="x" data-act="fs" aria-label="Vollbild">${FSI}</button>`)+`<div class="cbody">${earn}${paras}${fh}${empty}<div class="acts">${link}${amt&&p?'<button type="button" class="btn sec" data-act="shop">Zum Outfit-Shop</button>':''}<button type="button" class="btn sec" data-act="close">Schließen</button></div></div>`,' wide');
}
function askAdmin(){openOv(plainHead('Admin-Bereich')+`<div class="cbody" id="fadmin"><label class="f" for="acode">Admin-Code</label><input class="inp codein" id="acode" type="password" autocomplete="off" spellcheck="false" enterkeyhint="go"><p class="msg" id="cmsg" aria-live="polite"></p><div class="acts"><button type="button" class="btn full" data-act="admingo">Anmelden</button></div></div>`)}
function submitAdmin(){const m=$('#cmsg'),t=tooMany();if(t){m.textContent=waitMsg(t);return}if(hashCode($('#acode').value)!==st.adminHash){fail();m.textContent='Der Admin-Code stimmt nicht.';$('#acode').select();return}okTry();adminPass=$('#acode').value;closeOv();openAdmin()}

/* ===== Outfit-Shop ===== */
function openShop(){mk=null;shopTry=null;openOv(shopHtml(),' wide')}
let mk=null;
function lookFields(w,on){const sw=(act,arr,v,lab)=>`<div class="swatches">${arr.map((c,i)=>`<button type="button" class="swatch" style="background:${c}" data-act="${act}" data-i="${i}" aria-pressed="${v===i}" aria-label="${lab} ${i+1}"${on?'':' disabled'}></button>`).join('')}</div>`;
 return `<h3 class="f" style="margin-top:4px">Hautfarbe</h3>${sw('skin',SKIN,w.skin,'Hautfarbe')}<h3 class="f">Haarfarbe</h3>${sw('hair',HAIR,w.hair,'Haarfarbe')}<h3 class="f">Farbe des Strickpullis</h3>${sw('knit',KNIT,w.knit,'Pullifarbe')}<label class="f" for="wname">Name des Wichtels</label><input class="inp" id="wname" maxlength="30" value="${esc(w.name)}" placeholder="z. B. Flocke"${on?'':' disabled'}><p class="hint">Aussehen und Name sind kostenlos.</p>`}
function openMake(p,then){mk={p,then};openOv(makeHtml(),' wide')}
function makeHtml(){const p=mk.p,w=wallet(p.id);return `<div class="chd"><h2>Ihr Wichtel</h2>${XBTN}</div><div class="shop"><div class="sprev">${avatarSvg(w)}<p class="hint">${esc(w.name||'Wichtel von '+p.name)}</p></div><div><p style="margin:0;font-size:17px">Willkommen, ${esc(p.name)}! Gestalten Sie zuerst Ihren Wichtel. Für jedes Türchen sammelt er Münzen, mit denen Sie im Shop Mützen, Pullis und mehr kaufen können.</p>${lookFields(w,true)}<div class="acts"><button type="button" class="btn" data-act="makedone">Los geht’s</button></div></div></div>`}
function finishMake(){const m=mk;mk=null;if(!m)return;const w=wallet(m.p.id);w.made=true;saveWallet(m.p.id,w);closeOv();render();if(m.then)m.then()}
const dismiss=()=>{if(mk)finishMake();else closeOv()};
function shopHtml(){
 const p=adminOpen?null:person(),w=p?wallet(p.id):WDEF(),tryIt=shopTry&&ITEM[shopTry]&&ITEM[shopTry].cat===shopCat?ITEM[shopTry]:null;
 let body;
 if(shopCat==='look'){
  body=lookFields(w,!!p);
 }else{
  const items=SHOP.filter(i=>i.cat===shopCat);
  body=`<div class="items">${items.map(i=>{const own=w.owned.includes(i.id),worn=w.wear[i.cat]===i.id,pr=price(i);return `<button type="button" class="item" data-act="try" data-id="${i.id}" aria-pressed="${!!tryIt&&tryIt.id===i.id}">${avatarSvg(w,i.id,VB[i.cat])}<b>${esc(i.n)}</b><small class="${own?'own':''}">${worn?'Angezogen':own?'Im Schrank':pr?pr+' Münzen':'Gratis'}</small></button>`}).join('')}</div>`;
  let bar='<p class="hint" style="font-weight:400">Tippen Sie ein Teil an, um es anzuprobieren.</p>';
  if(tryIt){const own=w.owned.includes(tryIt.id),worn=w.wear[tryIt.cat]===tryIt.id,pr=price(tryIt);
   if(!p)bar=`<p>${esc(tryIt.n)}</p><span class="hint">Zum Einkaufen müssen Sie mit Ihrem Code angemeldet sein.</span>`;
   else if(worn)bar=`<p>${esc(tryIt.n)} trägt Ihr Wichtel schon.</p>${OPTIONAL.includes(tryIt.cat)?`<button type="button" class="btn sec" data-act="off" data-id="${tryIt.id}">Ausziehen</button>`:''}`;
   else if(own)bar=`<p>${esc(tryIt.n)} ist schon im Schrank.</p><button type="button" class="btn" data-act="wear" data-id="${tryIt.id}">Anziehen</button>`;
   else if(w.coins>=pr)bar=`<p>${esc(tryIt.n)}</p><button type="button" class="btn" data-act="buy" data-id="${tryIt.id}">${pr?'Kaufen für '+pr+' Münzen':'Gratis nehmen'}</button>`;
   else bar=`<p>${esc(tryIt.n)} kostet ${pr} Münzen. Es fehlen noch ${pr-w.coins}.</p><button type="button" class="btn" disabled>Kaufen</button>`;
  }
  body+=`<div class="sbar">${bar}</div>`;
 }
 return `<div class="chd"><h2>Outfit-Shop</h2><span class="chip" style="background:rgba(255,255,255,.16)">${COIN}<b>${w.coins}</b></span>${XBTN}</div><div class="shop"><div class="sprev">${avatarSvg(w,tryIt?tryIt.id:null)}<p class="hint">${p?esc(w.name||'Wichtel von '+p.name):'Vorschau'}</p></div><div><div class="cats seg" role="group">${CATS.map(([k,l])=>`<button type="button" data-act="cat" data-v="${k}" aria-pressed="${k===shopCat}">${l}</button>`).join('')}</div>${body}</div></div>`;

function shopAct(a,b){
 const p=person();
 if(a==='cat'){shopCat=b.dataset.v;shopTry=null;refreshShop();return}
 if(a==='try'){shopTry=b.dataset.id;refreshShop();return}
 if(!p||adminOpen)return;
 const w=wallet(p.id),it=ITEM[b.dataset.id];
 if(a==='skin'||a==='hair'||a==='knit'){w[a]=+b.dataset.i;saveWallet(p.id,w)}
 else if(a==='buy'&&it){const pr=price(it);if(w.owned.includes(it.id)||w.coins<pr)return;w.coins-=pr;w.owned.push(it.id);w.wear[it.cat]=it.id;saveWallet(p.id,w);coinSnd();toast(it.n+' gekauft!')}
 else if(a==='wear'&&it&&w.owned.includes(it.id)){w.wear[it.cat]=it.id;saveWallet(p.id,w)}
 else if(a==='off'&&it&&OPTIONAL.includes(it.cat)){w.wear[it.cat]='';saveWallet(p.id,w)}
 refreshShop();renderWichtel();renderWho();
}

function mergePlain(src){for(const id in src){const x=src[id]||{},c=plain[id]||{a:'',d:{}};plain[id]={a:c.a||String(x.a||''),d:Object.assign({},x.d||{},c.d)}}}

function genFor(p,n,set){let c,h,k=0;do{c=genCode();h=H24(c)}while(set.has(h)&&++k<200);set.add(h);if(n){p.h[n-1]=h;pl(p.id).d[n]=c}else{p.a=h;pl(p.id).a=c}changedP.add(p.id)}
function ensureCodes(s){const set=allHashes(s);s.people.forEach(p=>{if(s.settings.codeMode==='door'){for(let n=1;n<=24;n++)if(!p.h[n-1])genFor(p,n,set)}else if(!p.a)genFor(p,0,set)})}

function cardsHtml(){const door=draft.settings.codeMode==='door';return `<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>Codekarten</title><style>body{font:14px/1.4 Arial,sans-serif;margin:18px;color:#111}h1{font-size:20px;margin:0 0 14px}.c{break-inside:avoid;border:2px dashed #999;border-radius:14px;padding:12px 16px;margin:0 0 14px}.c h2{margin:0 0 8px;font-size:18px}.c p{margin:0 0 8px;color:#555}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:5px 14px}.g span{font-family:monospace;font-size:14px}.g b{display:inline-block;width:2.4em;font-family:Arial}.off{text-decoration:line-through;color:#999}</style></head><body><h1>${esc(draft.design.title)}: Codes</h1>${draft.people.filter(p=>p.on).map(p=>`<div class="c"><h2>${esc(p.name)}${p.group?' · '+esc(p.group):''}</h2><p>${door?'Für jedes Türchen gibt es einen eigenen Code. Einfach auf der Startseite eingeben.':'Mit diesem Code melden Sie sich an und öffnen jeden Tag ein Türchen.'}</p>${door?`<div class="g">${Array.from({length:24},(_,k)=>`<span class="${p.off.includes(k+1)?'off':''}"><b>${k+1}.</b>${esc(plainOf(p,k+1)||'—')}</span>`).join('')}</div>`:`<p style="font:700 20px monospace;color:#111">${esc(plainOf(p,0)||'—')}</p>`}</div>`).join('')}</body></html>`}
async function offerFile(name,data,fallback){if(downloads){try{await downloads.save({filename:name,data});return}catch(e){}}if(!window.claude){try{const u=URL.createObjectURL(new Blob([data],{type:/\.csv$/.test(name)?'text/csv;charset=utf-8':'text/html;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return}catch(e){}}try{await navigator.clipboard.writeText(fallback);toast('Herunterladen geht hier nicht. Die Codes wurden stattdessen kopiert.')}catch(e){toast('Herunterladen geht hier nicht.')}}
function buildHtml(s){
 const json=JSON.stringify(s).replace(/</g,'\\u003c');
 return '<!DOCTYPE html>\n<html lang="de">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>Schul-Adventskalender</title>\n<style id="css">'+CSS+'</style>\n</head>\n<body>\n<div id="root"></div>\n<script type="application/json" id="state">'+json+'<\/script>\n<script id="app-js">'+JS+'<\/script>\n</body>\n</html>\n';
}
function ghSection(){const g=ghCfg(),onClaude=!!(art&&canEdit);
 return `<div class="sec" style="margin-bottom:26px"><h3>Speichern auf deiner Webseite (GitHub)</h3><p class="hint">${onClaude?'Hier auf claude.ai wird direkt gespeichert. Für deine GitHub-Seite kannst du die Kalender-Datei herunterladen oder unten GitHub verbinden.':'Der Kalender speichert Änderungen direkt als neue Version in deinem GitHub-Repository. Nach etwa einer Minute ist sie auf der Webseite.'}</p>
 <div class="row"><div><label class="f" for="g-owner">GitHub-Name</label><input class="inp" id="g-owner" data-g="owner" value="${esc(g.owner)}" placeholder="z. B. maxmuster" autocomplete="off" spellcheck="false"></div><div><label class="f" for="g-repo">Repository</label><input class="inp" id="g-repo" data-g="repo" value="${esc(g.repo)}" placeholder="z. B. adventskalender" autocomplete="off" spellcheck="false"></div></div>
 <div class="row"><div><label class="f" for="g-path">Kalender-Datei</label><input class="inp" id="g-path" data-g="path" value="${esc(g.path)}" placeholder="index.html" autocomplete="off" spellcheck="false"></div><div><label class="f" for="g-branch">Branch (leer = Standard)</label><input class="inp" id="g-branch" data-g="branch" value="${esc(g.branch)}" placeholder="main" autocomplete="off" spellcheck="false"></div></div>
 <label class="f" for="g-token">Zugangsschlüssel (Token)</label><input class="inp" id="g-token" type="password" data-g="token" value="${esc(g.token)}" placeholder="github_pat_…" autocomplete="off" spellcheck="false"><p class="hint">Der Schlüssel bleibt nur in diesem Browser gespeichert und steht nie in der Kalender-Datei. Nur auf deinem eigenen Gerät eintragen.</p>
 <details style="margin-top:10px"><summary style="cursor:pointer;font-weight:800">So bekommst du den Zugangsschlüssel</summary><ol style="margin:8px 0 0;padding-left:20px;font-size:15px"><li>Auf github.com rechts oben aufs Profilbild, dann <b>Settings</b> → <b>Developer settings</b> → <b>Personal access tokens</b> → <b>Fine-grained tokens</b> → <b>Generate new token</b>.</li><li>Einen Namen eingeben, zum Beispiel „Adventskalender“, und ein Ablaufdatum nach Weihnachten wählen.</li><li>Bei <b>Repository access</b>: <b>Only select repositories</b> und dein Kalender-Repository wählen.</li><li>Bei <b>Permissions</b> → <b>Repository permissions</b> → <b>Contents</b>: <b>Read and write</b>.</li><li><b>Generate token</b>, den Schlüssel kopieren und oben einfügen.</li></ol></details>
 <div class="acts"><button type="button" class="btn sec" data-act="ghtest">Verbindung prüfen</button><button type="button" class="btn sec" data-act="dlhtml">Kalender-Datei herunterladen</button>${g.token?'<button type="button" class="mini del" data-act="ghforget">Schlüssel löschen</button>':''}</div><p class="hint" id="ghmsg" aria-live="polite"></p></div>`;
}
function validate(){
 if(newA1||newA2){if(norm(newA1).length<6){toast('Der Admin-Code braucht mindestens 6 Zeichen.');return false}if(norm(newA1)!==norm(newA2)){toast('Die beiden Admin-Codes stimmen nicht überein.');return false}}
 if(draft.people.some(p=>!p.name.trim())){toast('Jede Person braucht einen Namen.');return false}
 return true;
}
async function prepNext(){
 ensureCodes(draft);const next=clone(draft);next.sample=false;
 if(newA1)next.adminHash=hashCode(newA1);
 if(pendingReset)next.epoch=(+next.epoch||1)+1;
 if(pendingCoins)next.coinEpoch=(+next.coinEpoch||1)+1;
 const pass=newA1||adminPass;
 if(pass){const keep={};next.people.forEach(p=>{const c=plain[p.id];if(!c)return;const k={a:'',d:{}};if(c.a&&H24(c.a)===p.a)k.a=c.a;for(const n in c.d){if(c.d[n]&&H24(c.d[n])===p.h[n-1])k.d[n]=c.d[n]}if(k.a||Object.keys(k.d).length)keep[p.id]=k});const v=await vaultSeal(pass,keep);if(v)next.vault=v}
 return next;
}
function adopt(next){const np=newA1;for(const k of Object.keys(st))delete st[k];Object.assign(st,fix(clone(next)));index();if(np)adminPass=np;draft=clone(st);dirty=pendingReset=pendingCoins=closeArmed=false;newA1=newA2='';changedP=new Set();removedP=new Set();saving=false;render();buildSnow();renderAdmin()}
async function save(){
 if(saving)return;
 if(!dirty&&!pendingReset&&!pendingCoins&&!newA1){toast('Es gibt nichts zu speichern.');return}
 if(!validate())return;
 const viaClaude=!!(art&&canEdit),viaGh=!viaClaude&&ghReady();
 if(!viaClaude&&!viaGh){tab='settings';renderAdmin();$('#abody').scrollTop=0;toast('Bitte zuerst GitHub verbinden oder die Kalender-Datei herunterladen.');return}
 saving=true;setSt('Speichert …');
 let next;try{next=await prepNext()}catch(e){saving=false;setSt('');toast('Speichern hat nicht geklappt.');return}
 if(viaClaude){
  if(pendingReset&&db)for(const k of Object.keys(srvLocks)){try{await db.doc('locks/'+k).delete()}catch(e){}}
  if(pendingCoins&&db)for(const k of Object.keys(srvWallets)){try{await db.doc('wallets/'+k).delete()}catch(e){}}
  if(db){for(const id of changedP){if(!next.people.some(p=>p.id===id))continue;const c=pl(id);try{await db.doc('admin/'+id).set({a:c.a||'',d:c.d||{}})}catch(e){}}for(const id of removedP){try{await db.doc('admin/'+id).delete()}catch(e){}}}
  try{ss.set('reopen','1');ss.set('tab',tab);await art.publish(buildHtml(next));setSt('Gespeichert. Die Seite lädt neu …')}
  catch(e){ss.set('reopen',null);saving=false;const c=e&&e.code;setSt('');toast(c==='conflict'?'Jemand anderes hat gerade gespeichert. Die Seite lädt neu, bitte die Änderung danach erneut eintragen.':c==='not_writer'||c==='not_granted'?'Keine Berechtigung zum Speichern.':'Speichern hat nicht geklappt. Bitte noch einmal versuchen.')}
  return;
 }
 try{await ghPut(ghCfg().path,b64txt(buildHtml(next)),'Adventskalender gespeichert');adopt(next);setSt('Gespeichert. In etwa einer Minute ist die neue Version auf der Webseite.')}
 catch(e){saving=false;setSt('');toast(ghErr(e))}
}

 else shopAct(a,b);

ab.addEventListener('input',e=>{const t=e.target,ds=t.dataset;
 if(t.id==='pq'){pq=t.value;const pos=t.selectionStart;renderAdmin();const n=$('#pq');n.focus();try{n.setSelectionRange(pos,pos)}catch(err){}return}
 if(ds.k!=null){draft.doors[sel-1][ds.k]=ds.k==='openDay'?(t.value?+t.value:''):t.value;dirty1();if(ds.k==='openDay'){render();renderAdmin()}}
 else if(ds.d!=null){draft.design[ds.d]=t.type==='checkbox'?t.checked:t.value;dirty1();if(ds.d==='snow')buildSnow();render()}
 else if(ds.c!=null){draft.design.colors[ds.c]=t.value;dirty1();render()}
 else if(ds.s!=null){draft.settings[ds.s]=t.type==='checkbox'?t.checked:t.type==='number'?+t.value:t.value;dirty1();render()}
 else if(ds.price!=null){draft.settings.prices[ds.price]=t.value===''?null:Math.max(0,Math.floor(+t.value||0));dirty1()}
 else if(ds.pn!=null){draft.people[+ds.pn].name=t.value;dirty1()}
 else if(ds.pg!=null){draft.people[+ds.pg].group=t.value;dirty1()}
 else if(ds.prl!=null){draft.people[+ds.prl].role=t.value==='lehrer'?'lehrer':'schueler';dirty1()}
 else if(ds.pon!=null){draft.people[+ds.pon].on=t.checked;dirty1();renderAdmin()}
 else if(ds.coff!=null){const[i,n]=ds.coff.split(':').map(Number),p=draft.people[i];p.off=t.checked?p.off.filter(x=>x!==n):[...new Set([...p.off,n])];dirty1();t.closest('.cchip').classList.toggle('off',!t.checked)}

ab.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='pv'){ss.set('preview',t.value||null);render();return}
 if(t.id!=='fu'&&t.id!=='bgu')return;
 const viaA=!!assets&&canEdit;if(!viaA&&!ghReady()){toast('Zum Hochladen zuerst unter Einstellungen GitHub verbinden.');return}
 const fs=[...t.files],door=sel,bg=t.id==='bgu';t.value='';
 for(const f of fs){
  if(f.size>20*1048576){toast('„'+f.name+'“ ist größer als 20 MB.');continue}
  setSt('Lädt hoch: '+f.name+' …');
  try{let rec;if(viaA){const r=await assets.upload(f);rec={id:String(r.id),url:String(r.url||''),name:f.name,type:String(r.contentType||f.type||''),size:+r.sizeBytes||f.size}}else rec=await ghUpload(f);if(bg)draft.design.bgImage=rec;else draft.doors[door-1].files.push(rec);dirty1()}
  catch(err){toast(viaA?'„'+f.name+'“ konnte nicht hochgeladen werden.':ghErr(err))}
 }

ab.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,i=+b.dataset.i;
 if(a!=='prm')rmArm='';
 if(a==='sel'){sel=+b.dataset.n;renderAdmin();$('#d-title')?.focus()}
 else if(a==='rmfile'){draft.doors[sel-1].files.splice(i,1);dirty1();renderAdmin()}
 else if(a==='preview')showContent(sel,draft,0);
 else if(a==='preset'){draft.design.colors={...PRESETS[i].c};dirty1();render();renderAdmin()}
 else if(a==='seg'){const k=b.dataset.key,v=b.dataset.v;if(k==='pf'){pf=v;renderAdmin();return}if(k.startsWith('s:')){draft.settings[k.slice(2)]=v;if(k==='s:codeMode')ensureCodes(draft)}else draft.design[k]=v;dirty1();render();renderAdmin()}
 else if(a==='rmbg'){draft.design.bgImage=null;dirty1();render();renderAdmin()}
 else if(a==='resetdesign'){draft.design=Object.assign(DEFD(),{title:draft.design.title,subtitle:draft.design.subtitle,loginHint:draft.design.loginHint});dirty1();buildSnow();render();renderAdmin()}
 else if(a==='pcodes'){const id=b.dataset.id;openP.has(id)?openP.delete(id):openP.add(id);renderAdmin()}
 else if(a==='prm'){const p=draft.people[i];if(rmArm!==p.id){rmArm=p.id;renderAdmin();return}rmArm='';draft.people.splice(i,1);removedP.add(p.id);changedP.delete(p.id);dirty1();renderAdmin()}
 else if(a==='regen'){const p=draft.people[i],n=+b.dataset.n;genFor(p,n,allHashes(draft));dirty1();renderAdmin()}
 else if(a==='regenall'){const p=draft.people[i],set=allHashes(draft);for(let n=1;n<=24;n++)genFor(p,n,set);dirty1();renderAdmin();toast('24 neue Codes für '+p.name+'. Sie gelten nach dem Speichern.')}
 else if(a==='copyp'||a==='copyall'){const txt=codesText(a==='copyp'?[draft.people[i]]:draft.people);try{await navigator.clipboard.writeText(txt);toast('Codes kopiert.')}catch(err){toast('Kopieren geht hier nicht.')}}
 else if(a==='addpeople'){const names=$('#pnames').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).slice(0,300);if(!names.length){toast('Bitte mindestens einen Namen eintragen.');return}const role=$('#prole').value==='lehrer'?'lehrer':'schueler',group=$('#pgroup').value.trim();names.forEach(n=>draft.people.push({id:newId()+rnd(1e6).toString(36),name:n.slice(0,60),role,group,on:true,h:Array(24).fill(''),off:[],a:''}));ensureCodes(draft);dirty1();renderAdmin();toast(names.length+(names.length===1?' Person':' Personen')+' hinzugefügt.')}
 else if(a==='dlcsv')offerFile('Adventskalender-Codes.csv',csvText(),codesText(draft.people));
 else if(a==='dlcards')offerFile('Codekarten.html',cardsHtml(),codesText(draft.people));
 else if(a==='resetall'){pendingReset=!pendingReset;dirty1();renderAdmin()}
 else if(a==='resetcoins'){pendingCoins=!pendingCoins;dirty1();renderAdmin()}

 else if(a==='ghtest'){const m=$('#ghmsg'),g=ghCfg();if(!ghReady()){m.textContent='Bitte GitHub-Name, Repository, Datei und Zugangsschlüssel eintragen.';return}m.textContent='Prüfe …';try{const r=await gh('GET',repoUrl()),br=g.branch||r.default_branch||'main';let found=true;try{await gh('GET',repoUrl()+'/contents/'+encPath(g.path)+'?ref='+encodeURIComponent(br))}catch(e){if(e.status===404)found=false;else throw e}const push=!r.permissions||r.permissions.push!==false;m.textContent='Verbunden mit '+r.full_name+' (Branch '+br+'). '+(found?'Die Datei '+g.path+' ist da.':'Die Datei '+g.path+' gibt es noch nicht, sie wird beim Speichern angelegt.')+(push?'':' Achtung: Der Schlüssel darf nicht schreiben.');renderAdmin();const m2=$('#ghmsg');if(m2)m2.textContent=m.textContent}catch(e){m.textContent=ghErr(e)}}
 else if(a==='dlhtml'){if(!validate())return;const next=await prepNext();await offerFile('index.html',buildHtml(next),'');toast('Datei „index.html“ erstellt. Lade sie in dein Repository hoch und ersetze die alte Datei.')}
 else if(a==='clearlocal'){ls.set('locks',{});ls.set('opened',{e:st.epoch,m:{}});okTry();render();toast('Sperren auf diesem Gerät gelöscht.')}
});
